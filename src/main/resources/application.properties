# ==============================
# Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/employees?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==============================
# Server Configuration
# ==============================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ==============================
# Swagger / OpenAPI Info
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.model-and-view-allowed=true
springdoc.show-actuator=true
springdoc.packages-to-scan=com.example.mysql_crud.controller

# Optional: Default API Info (used in OpenApiConfig.java if needed)
springdoc.info.title=MySQL CRUD API
springdoc.info.version=v1.0.0
springdoc.info.description=Spring Boot CRUD API for Users and Posts
springdoc.info.terms-of-service=http://example.com/terms
springdoc.info.contact.name=Pawan
springdoc.info.contact.email=pawan@example.com
springdoc.info.license.name=Apache 2.0
springdoc.info.license.url=http://springdoc.org
